<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="components/page_transitions.css">
<script src="components/page_transitions.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FAMOUS — Watch Video</title>
<script src="components/mockdata.js"></script>
<meta name="theme-color" content="#070707">
<meta property="og:type" content="video.other">
<meta property="og:title" id="ogTitle" content="AI-generated video — FAMOUS">
<meta property="og:description" content="Created with FAMOUS AI — the Telegram bot that puts your face in any video.">
<meta property="og:video" id="ogVideo" content="">
<meta property="og:video:type" content="video/mp4">
<meta property="og:image" id="ogImage" content="">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Archivo+Black&display=swap');

:root{
  --bg:#070707;
  --bg-2:#0d0d0f;
  --panel:#111114;
  --line:rgba(255,255,255,0.08);
  --line-2:rgba(255,255,255,0.14);
  --text:#f3f3f5;
  --text-dim:#8b8b92;
  --text-mute:#55555c;
  --brand:#3dff6e;
  --brand-2:#00e85a;
  --accent:#ff3d9e;
  --danger:#ff4d6d;
  --font-display:'Space Grotesk','SF Pro Display',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  --font-heavy:'Archivo Black','Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-display);-webkit-font-smoothing:antialiased;}
body{overflow-x:hidden;}

/* ── Ambient backdrop (blurred hero of the video) ── */
.backdrop{position:fixed;inset:-10%;z-index:0;pointer-events:none;filter:blur(80px) saturate(1.3);opacity:0.55;transition:opacity .6s;}
.backdrop::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,transparent,rgba(7,7,7,0.7) 60%,var(--bg) 100%);}
.backdrop-img{width:100%;height:100%;object-fit:cover;display:block;}

/* ── Layout ─────────────────────────── */
.wrapper{position:relative;z-index:1;display:flex;justify-content:center;min-height:100vh;min-height:100dvh;}
.app{width:100%;max-width:480px;min-width:320px;display:flex;flex-direction:column;padding:0 0 40px;}

/* Hero screen — topbar + centered video exactly fills first viewport */
.hero-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.player-section{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px 20px;}

/* ── Topbar ─────────────────────────── */
.topbar{width:100%;padding:max(16px,env(safe-area-inset-top)) 22px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:9px;}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--brand);flex-shrink:0;box-shadow:0 0 8px rgba(61,255,110,0.7);animation:brandPulse 2s ease-in-out infinite;}
@keyframes brandPulse{0%,100%{box-shadow:0 0 6px rgba(61,255,110,0.55);}50%{box-shadow:0 0 14px rgba(61,255,110,1);}}
.brand-name{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-0.03em;color:#fff;line-height:1;}
.brand-name .thin{font-weight:300;color:rgba(255,255,255,0.85);}
.ai-badge{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--brand);background:rgba(61,255,110,0.12);border:1px solid rgba(61,255,110,0.3);padding:5px 11px;border-radius:999px;backdrop-filter:blur(10px);}

/* ── Player ─────────────────────────── */
.player-wrap{width:100%;display:flex;align-items:center;justify-content:center;}
.player-box{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:9/16;width:100%;max-width:440px;max-height:calc(100dvh - 120px);margin:0 auto;box-shadow:0 30px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.05);}
.player-box.landscape{aspect-ratio:16/9;max-width:100%;max-height:60vh;}
.player-box video{width:100%;height:100%;object-fit:cover;display:block;}

.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.32);cursor:pointer;transition:opacity .25s;z-index:3;}
.play-overlay.hidden{opacity:0;pointer-events:none;}
.play-circle{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,0.16);border:1.5px solid rgba(255,255,255,0.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);transition:transform .2s,background .2s;}
.play-overlay:hover .play-circle{transform:scale(1.08);background:rgba(255,255,255,0.25);}
.play-circle svg{width:30px;height:30px;fill:#fff;margin-left:4px;}

.mute-btn{position:absolute;top:14px;right:14px;z-index:4;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);cursor:pointer;transition:background .2s;}
.mute-btn:hover{background:rgba(0,0,0,0.7);}
.mute-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;}

.watermark{position:absolute;top:14px;left:14px;z-index:4;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:999px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(10px);}
.watermark .wm-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 6px var(--brand);}
.watermark .wm-name{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:-0.02em;color:#fff;line-height:1;}
.watermark .wm-name .thin{font-weight:300;color:rgba(255,255,255,0.85);}

/* ── Meta ───────────────────────────── */
.meta{width:100%;padding:18px 24px 0;}
.meta-eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.14em;color:var(--brand);text-transform:uppercase;margin-bottom:8px;}
.meta-title{font-family:var(--font-heavy);font-size:26px;letter-spacing:-0.03em;color:#fff;line-height:1.05;margin-bottom:10px;}
.meta-sub{display:flex;flex-wrap:wrap;gap:6px;}
.meta-chip{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,0.05);border:1px solid var(--line);color:var(--text-dim);}

/* ── Actions ────────────────────────── */
.actions{width:100%;padding:18px 20px 0;display:flex;flex-direction:column;gap:10px;}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:16px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:transform .15s,background .2s,border-color .2s;border:1.5px solid transparent;}
.btn:active{transform:scale(0.98);}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;flex-shrink:0;}

.btn-primary{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#001b08;box-shadow:0 12px 32px -10px rgba(61,255,110,0.55);position:relative;overflow:hidden;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 44px -10px rgba(61,255,110,0.7);}
.btn-primary svg{stroke:#001b08;fill:none;}
.btn-primary::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.45),transparent);animation:shine 3s ease-in-out infinite;}
@keyframes shine{0%,60%{left:-60%;}100%{left:160%;}}

.btn-ghost{background:rgba(255,255,255,0.04);border-color:var(--line-2);color:#fff;}
.btn-ghost:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.25);}
.btn-ghost.copied{border-color:var(--brand);color:var(--brand);background:rgba(61,255,110,0.06);}

.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── Divider ────────────────────────── */
.divider{width:100%;padding:28px 24px 0;display:flex;align-items:center;gap:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
.divider span{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--text-mute);letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap;}

/* ── CTA card ───────────────────────── */
.cta{width:100%;padding:22px 20px 0;}
.cta-card{position:relative;padding:24px;border-radius:22px;background:linear-gradient(160deg,rgba(61,255,110,0.08) 0%,rgba(61,255,110,0.02) 50%,rgba(255,61,158,0.04) 100%);border:1px solid rgba(61,255,110,0.2);text-align:center;overflow:hidden;}
.cta-card::before{content:'';position:absolute;top:-40%;right:-30%;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(61,255,110,0.2) 0%,transparent 60%);pointer-events:none;}
.cta-card::after{content:'';position:absolute;bottom:-40%;left:-30%;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,158,0.12) 0%,transparent 60%);pointer-events:none;}
.cta-card > *{position:relative;z-index:1;}
.cta-label{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--brand);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:12px;padding:4px 10px;border-radius:999px;background:rgba(61,255,110,0.08);border:1px solid rgba(61,255,110,0.2);}
.cta-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand);}
.cta-title{font-family:var(--font-heavy);font-size:28px;letter-spacing:-0.04em;color:#fff;margin-bottom:10px;line-height:1;}
.cta-desc{font-family:var(--font-display);font-size:14px;color:var(--text-dim);line-height:1.55;margin-bottom:20px;max-width:320px;margin-left:auto;margin-right:auto;}

/* ── Error state ────────────────────── */
.error-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;padding:40px 28px;text-align:center;gap:18px;}
.e-icon{width:84px;height:84px;border-radius:50%;background:rgba(255,77,109,0.08);border:1.5px solid rgba(255,77,109,0.22);display:flex;align-items:center;justify-content:center;}
.e-icon svg{width:34px;height:34px;stroke:#ff4d6d;fill:none;stroke-width:1.6;}
.e-title{font-family:var(--font-heavy);font-size:26px;letter-spacing:-0.03em;color:#fff;}
.e-desc{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);line-height:1.7;max-width:280px;}

/* ── Toast ──────────────────────────── */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(20,20,24,0.95);border:1px solid rgba(61,255,110,0.35);border-radius:999px;padding:11px 22px;font-family:var(--font-mono);font-size:12px;font-weight:600;color:#fff;letter-spacing:0.04em;display:flex;align-items:center;gap:10px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:999;backdrop-filter:blur(20px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .t-icon{width:18px;height:18px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.toast .t-icon svg{width:9px;height:9px;stroke:#001b08;fill:none;stroke-width:3;}

/* ── Skeleton ───────────────────────── */
.sk-player{aspect-ratio:9/16;width:100%;max-width:440px;max-height:calc(100dvh - 120px);border-radius:24px;background:linear-gradient(90deg,rgba(255,255,255,0.04),rgba(255,255,255,0.08),rgba(255,255,255,0.04));background-size:200% 100%;animation:skAnim 1.4s infinite linear;}
@keyframes skAnim{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media (max-width:380px){
  .meta-title{font-size:22px;}
  .cta-title{font-size:24px;}
}
</style>
</head>
<body>

<div class="backdrop" id="backdrop"></div>

<div class="wrapper"><div class="app">

  <div class="hero-screen">
    <div class="topbar">
      <div class="brand"><div class="brand-dot"></div><div class="brand-name">fam<span class="thin">ous</span></div></div>
      <div class="ai-badge">AI VIDEO</div>
    </div>
    <div class="player-section" id="playerSection"></div>
  </div>

  <div id="content" style="width:100%;display:flex;flex-direction:column;"></div>

</div></div>

<div class="toast" id="toast">
  <div class="t-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
  <span id="toastMsg">Copied</span>
</div>

<script>
const params = new URLSearchParams(location.search);
const genId  = params.get('id');
const BOT    = 'aifamous_bot';

function showToast(msg){
  const t=document.getElementById('toast'), m=document.getElementById('toastMsg');
  m.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),2000);
}

function copyLink(){
  const url=location.href;
  const done=()=>{
    showToast('Link copied');
    const btn=document.getElementById('copyBtn');
    if(btn){btn.classList.add('copied');setTimeout(()=>btn.classList.remove('copied'),1600);}
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(done).catch(fallbackCopy);
  } else { fallbackCopy(); }
  function fallbackCopy(){
    const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);done();
  }
}

function shareNative(){
  const url=location.href;
  if(navigator.share){
    navigator.share({title:'AI video on FAMOUS', text:'Check out this AI-generated video 🎬', url}).catch(()=>{});
  } else {
    shareTelegram();
  }
}

function shareTelegram(){
  const url=encodeURIComponent(location.href);
  const text=encodeURIComponent('Check out this AI-generated video 🎬');
  window.open('https://t.me/share/url?url='+url+'&text='+text,'_blank');
}

function formatDate(iso){
  if(!iso) return '';
  try{
    const d=new Date(iso);
    if(isNaN(d)) return '';
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }catch(e){return '';}
}

function modeLabel(mode){
  if(!mode) return 'AI VIDEO';
  return String(mode).replace(/_/g,' ').toUpperCase();
}

function renderVideo(videoUrl, meta){
  const mode=modeLabel(meta.mode);
  const date=formatDate(meta.finished_at);

  const og = document.getElementById('ogVideo'); if(og) og.content = location.origin + videoUrl;

  // set backdrop to the first frame of the video
  const backdrop=document.getElementById('backdrop');
  backdrop.innerHTML = `<video class="backdrop-img" src="${videoUrl}#t=0.1" muted playsinline preload="metadata" autoplay loop></video>`;

  const supportsShare = !!navigator.share;

  document.getElementById('playerSection').innerHTML=`
    <div class="player-wrap">
      <div class="player-box" id="playerBox">
        <video id="vid" src="${videoUrl}" loop playsinline webkit-playsinline preload="metadata"></video>
        <div class="watermark"><div class="wm-dot"></div><div class="wm-name">fam<span class="thin">ous</span></div></div>
        <button class="mute-btn" id="muteBtn" aria-label="Toggle sound" onclick="toggleMute(event)">
          <svg id="muteIcon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <div class="play-overlay" id="playOverlay" onclick="togglePlay()">
          <div class="play-circle"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></svg></div>
        </div>
      </div>
    </div>`;

  document.getElementById('content').innerHTML=`
    <div class="meta">
      <div class="meta-eyebrow">AI-generated</div>
      <div class="meta-title">Face swap video</div>
      <div class="meta-sub">
        <span class="meta-chip">${mode}</span>
        ${date?`<span class="meta-chip">${date}</span>`:''}
        <span class="meta-chip">MP4</span>
      </div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="${videoUrl}" download="famous_video.mp4">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download video
      </a>
      <div class="action-row">
        <button class="btn btn-ghost" id="copyBtn" onclick="copyLink()">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Copy link
        </button>
        <button class="btn btn-ghost" onclick="${supportsShare?'shareNative()':'shareTelegram()'}">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
          Share
        </button>
      </div>
    </div>

    <div class="divider"><span>Create your own</span></div>

    <div class="cta">
      <div class="cta-card">
        <div class="cta-label">famous AI</div>
        <div class="cta-title">Become the star</div>
        <div class="cta-desc">Put your face in any scene — 60 seconds, right inside Telegram.</div>
        <a class="btn btn-primary" href="https://t.me/${BOT}" target="_blank" style="max-width:280px;margin:0 auto;">
          <svg viewBox="0 0 24 24"><path d="M21.198 2.433a2.242 2.242 0 0 0-1.022.215l-16.5 7a2.25 2.25 0 0 0 .126 4.154l4.371 1.457 1.457 4.371a2.25 2.25 0 0 0 4.154.126l7-16.5a2.242 2.242 0 0 0-.586-2.823z" fill="currentColor" stroke="none"/></svg>
          Try famous free
        </a>
      </div>
    </div>`;

  const vid=document.getElementById('vid');
  // detect landscape and adjust aspect ratio once metadata loads
  vid.addEventListener('loadedmetadata',()=>{
    if(vid.videoWidth > vid.videoHeight){
      document.getElementById('playerBox').classList.add('landscape');
    }
  });
  vid.muted=true;
  vid.play().then(()=>{
    document.getElementById('playOverlay').classList.add('hidden');
  }).catch(()=>{});
  vid.addEventListener('pause',()=>document.getElementById('playOverlay')?.classList.remove('hidden'));
  vid.addEventListener('play', ()=>document.getElementById('playOverlay')?.classList.add('hidden'));
}

function togglePlay(){
  const vid=document.getElementById('vid'); if(!vid) return;
  vid.paused ? vid.play() : vid.pause();
}

function toggleMute(e){
  e && e.stopPropagation();
  const vid=document.getElementById('vid'); if(!vid) return;
  vid.muted=!vid.muted;
  const svg=document.getElementById('muteIcon');
  svg.innerHTML = vid.muted
    ? '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'
    : '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
}

function renderError(){
  document.getElementById('playerSection').innerHTML='';
  document.getElementById('content').innerHTML=`
    <div class="error-state">
      <div class="e-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
      <div class="e-title">Video not found</div>
      <div class="e-desc">This video may have been removed or set to private. The link could also be invalid.</div>
      <a class="btn btn-primary" href="https://t.me/${BOT}" style="max-width:260px;margin-top:10px;">
        <svg viewBox="0 0 24 24"><path d="M21.198 2.433a2.242 2.242 0 0 0-1.022.215l-16.5 7a2.25 2.25 0 0 0 .126 4.154l4.371 1.457 1.457 4.371a2.25 2.25 0 0 0 4.154.126l7-16.5a2.242 2.242 0 0 0-.586-2.823z" fill="currentColor" stroke="none"/></svg>
        Open famous
      </a>
    </div>`;
}

function renderSkeleton(){
  document.getElementById('playerSection').innerHTML=`
    <div class="player-wrap"><div class="sk-player"></div></div>`;
  document.getElementById('content').innerHTML='';
}

async function load(){
  if(!genId){renderError();return;}
  renderSkeleton();
  let meta={};
  try{
    const r=await fetch('/api/public/video/'+genId);
    if(!r.ok){renderError();return;}
    meta=await r.json();
  }catch(e){renderError();return;}
  renderVideo('/api/video/'+genId, meta);
}

load();
</script>
</body>
</html>
