<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>famous — Tokens History</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="components/mockdata.js"></script>
<link rel="stylesheet" href="components/famous.css">
<link rel="stylesheet" href="components/page_transitions.css">
<script src="components/page_transitions.js"></script>
<style>
.th-hero{padding:24px 20px 8px;text-align:center;background:linear-gradient(180deg,rgba(61,255,110,0.06),transparent);}
.th-balance{margin:16px 20px 0;padding:18px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(61,255,110,0.10),rgba(61,255,110,0.02));border:1px solid rgba(61,255,110,0.25);display:flex;align-items:center;gap:14px;}
.th-balance .b-icon{width:44px;height:44px;border-radius:14px;background:rgba(61,255,110,0.15);display:flex;align-items:center;justify-content:center;color:var(--brand);flex-shrink:0;}
.th-balance .b-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
.th-balance .b-text{flex:1;}
.th-balance .b-lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;}
.th-balance .b-val{font-family:var(--font-heavy);font-size:30px;letter-spacing:-0.03em;color:#fff;line-height:1;margin-top:4px;}
.th-balance .b-val .unit{font-family:var(--font-mono);font-size:10px;color:var(--brand);font-weight:500;margin-left:6px;letter-spacing:0.04em;text-transform:uppercase;}

.th-section-title{font-family:var(--font-mono);font-size:10px;color:var(--text-mute);letter-spacing:0.12em;text-transform:uppercase;padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center;}
.th-section-title .count{color:var(--text-dim);font-weight:600;}

/* ── Filter chips ─── */
.th-filters{display:flex;gap:6px;padding:0 20px 6px;}
.th-filters + .th-filters{padding-top:0;}
.th-chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.05);border:1px solid var(--line-2);font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.04em;color:#cfcfd5;text-transform:uppercase;cursor:pointer;transition:all .18s;white-space:nowrap;}
.th-chip:hover{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.25);color:#fff;}
.th-chip.active{background:var(--brand);color:#000;border-color:var(--brand);}

/* ── Transaction list ─── */
.tx-list{margin:0 20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,0.02);}
.tx-row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);}
.tx-row:last-child{border-bottom:none;}
.tx-icon{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-dim);}
.tx-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
.tx-icon.plus{background:rgba(61,255,110,0.12);color:var(--brand);}
.tx-icon.minus{background:rgba(255,77,109,0.12);color:var(--danger);}
.tx-text{flex:1;min-width:0;}
.tx-title{font-family:var(--font-mono);font-size:12px;color:#fff;font-weight:600;letter-spacing:0.02em;line-height:1.2;}
.tx-sub{font-family:var(--font-mono);font-size:9.5px;color:var(--text-mute);letter-spacing:0.04em;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
.tx-sub .dot{color:var(--text-mute);}
.tx-amt{font-family:var(--font-heavy);font-size:16px;letter-spacing:-0.01em;flex-shrink:0;}
.tx-amt.plus{color:var(--brand);}
.tx-amt.minus{color:var(--danger);}
.tx-empty{padding:60px 20px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-mute);letter-spacing:0.04em;line-height:1.7;}
.tx-empty svg{width:42px;height:42px;stroke:rgba(255,255,255,0.1);fill:none;stroke-width:1.5;display:block;margin:0 auto 14px;}

.err-box{padding:40px 20px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrapper">
<div class="app">

  <div class="sub-header">
    <div class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </div>
    <div class="sub-title">Tokens History</div>
    <div></div>
  </div>

  <div class="app-scroll" id="content">
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
      <div class="loading-ring"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-btn" onclick="location.href='main.html'">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v11a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V11z"/></svg>
      <div class="n-label">Home</div>
    </div>
    <div class="nav-btn" onclick="location.href='all_videos.html?tab=models'">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/></svg>
      <div class="n-label">Models</div>
    </div>
    <div class="nav-center" onclick="location.href='create_video.html'">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div class="nav-btn" onclick="location.href='all_videos.html'">
      <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/></svg>
      <div class="n-label">Videos</div>
    </div>
    <div class="nav-btn" onclick="location.href='profile.html'">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      <div class="n-label">Profile</div>
    </div>
  </nav>
</div>
</div>

<div class="toast-container"><div class="toast" id="toast"><div class="t-icon"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></div><span id="toastMsg">Done</span></div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#070707'); tg.setBackgroundColor && tg.setBackgroundColor('#070707'); }
function getInitData(){ return (tg && tg.initData) ? tg.initData : ''; }

document.getElementById('backBtn').addEventListener('click', () => {
  if (history.length > 1) history.back(); else location.href = 'subscription.html';
});

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── Friendly labels ──
function txLabel(tx) {
  const r = String(tx.reason || '');
  const amt = Number(tx.amount || 0);
  if (r === 'welcome_grant')   return 'welcome bonus';
  if (r === 'plan_grant')      return 'plan activation' + (tx.ref_id ? ' · ' + tx.ref_id : '');
  if (r === 'tokens_purchase') return 'token pack purchase';
  if (r === 'invite_bonus') {
    const u = tx.invitee_username;
    return u ? ('invite bonus · @' + u) : 'invite bonus';
  }
  if (r === 'invite_bonus_revoked') return 'invite bonus revoked';
  if (r === 'admin_set' || r === 'admin_reset') return 'admin adjustment';
  if (r === 'admin_plan_reset') return 'admin plan reset';
  if (r === 'model_create')    return 'model creation';
  if (r.startsWith('video_gen_')) return 'video generation · ' + r.replace('video_gen_', '');
  if (r === 'video_gen')       return 'video generation';
  return r.toLowerCase() || (amt > 0 ? 'credit' : 'debit');
}

function txCategory(reason) {
  const r = String(reason || '');
  if (r === 'welcome_grant') return 'welcome';
  if (r === 'plan_grant' || r === 'tokens_purchase') return 'purchase';
  if (r === 'invite_bonus') return 'invite';
  if (r === 'model_create' || r.startsWith('video_gen')) return 'spend';
  if (r.startsWith('admin_')) return 'admin';
  return 'other';
}

function fmtTxDate(s) {
  if (!s) return '';
  try {
    const d = new Date(s.replace(' ', 'T') + 'Z');
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) {
      return 'Today · ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    if (d.toDateString() === yest.toDateString()) {
      return 'Yesterday · ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
           ' · ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  } catch (e) { return s; }
}

let _state = null;
let _history = [];
let _filter = 'all';

async function loadAll() {
  try {
    const headers = { 'X-Telegram-Init-Data': getInitData() };
    const [subRes, hisRes] = await Promise.all([
      fetch('/api/subscription', { headers }),
      fetch('/api/tokens/history', { headers }),
    ]);
    if (subRes.status === 401) {
      document.getElementById('content').innerHTML = '<div class="err-box">Open this page from Telegram to see your history.</div>';
      return;
    }
    if (subRes.ok) _state = await subRes.json();
    if (hisRes.ok) {
      const h = await hisRes.json().catch(() => ({}));
      _history = h.history || [];
    }
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="err-box">Couldn\'t load transactions. <br>Check your connection and try again.</div>';
  }
}

const COIN_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 10h8M8 14h8M10 7v10M14 7v10"/></svg>';
const ARROW_UP = '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const ARROW_DOWN = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';

function applyFilter(list) {
  if (_filter === 'all') return list;
  if (_filter === 'plus') return list.filter(t => Number(t.amount) > 0);
  if (_filter === 'minus') return list.filter(t => Number(t.amount) < 0);
  return list.filter(t => txCategory(t.reason) === _filter);
}

function render() {
  const root = document.createElement('div');

  // Hero + balance
  const balance = _state && _state.current ? _state.current.tokens_balance : '—';
  const hero = document.createElement('div');
  hero.innerHTML =
    '<div class="th-hero">' +
      '<div style="font-family:var(--font-heavy);font-size:26px;letter-spacing:-0.03em;color:#fff;line-height:1.1">Your token activity</div>' +
      '<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:8px;letter-spacing:0.04em;line-height:1.6">Every credit and debit recorded.<br>Earned, spent, refunded — full audit trail.</div>' +
    '</div>' +
    '<div class="th-balance">' +
      '<div class="b-icon">' + COIN_SVG + '</div>' +
      '<div class="b-text">' +
        '<div class="b-lbl">Current balance</div>' +
        '<div class="b-val">' + balance + '<span class="unit">tokens</span></div>' +
      '</div>' +
    '</div>';
  root.appendChild(hero);

  // Section title
  const sectionTitle = document.createElement('div');
  sectionTitle.className = 'th-section-title';
  sectionTitle.innerHTML = 'Transactions <span class="count">' + _history.length + '</span>';
  root.appendChild(sectionTitle);

  // Filter chips — two rows:
  //   row 1: All / + Credits / − Debits
  //   row 2: Generations / Purchases / Invites
  const buildRow = (opts) => {
    const row = document.createElement('div');
    row.className = 'th-filters';
    opts.forEach(o => {
      const chip = document.createElement('div');
      chip.className = 'th-chip' + (o.id === _filter ? ' active' : '');
      chip.textContent = o.label;
      chip.addEventListener('click', () => { _filter = o.id; render(); });
      row.appendChild(chip);
    });
    return row;
  };
  root.appendChild(buildRow([
    { id: 'all',   label: 'All' },
    { id: 'plus',  label: '+ Credits' },
    { id: 'minus', label: '− Debits' },
  ]));
  root.appendChild(buildRow([
    { id: 'spend',    label: 'Generations' },
    { id: 'purchase', label: 'Purchases' },
    { id: 'invite',   label: 'Invites' },
  ]));

  const list = applyFilter(_history);

  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'tx-empty';
    empty.innerHTML =
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 10h8M8 14h8M10 7v10M14 7v10"/></svg>' +
      (_history.length ? 'No transactions match this filter.' : 'No transactions yet.<br>Earn tokens by inviting friends or buying a plan.');
    root.appendChild(empty);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'tx-list';
    wrap.innerHTML = list.map(tx => {
      const amt = Number(tx.amount || 0);
      const isPlus = amt > 0;
      const sign = isPlus ? '+' : '';
      const arrow = isPlus ? ARROW_UP : ARROW_DOWN;
      const cls = isPlus ? 'plus' : 'minus';
      const label = escapeHtml(txLabel(tx));
      const date = escapeHtml(fmtTxDate(tx.created_at));
      const bal = (tx.balance_after != null) ? ('<span class="dot">·</span> balance ' + tx.balance_after) : '';
      return (
        '<div class="tx-row">' +
          '<div class="tx-icon ' + cls + '">' + arrow + '</div>' +
          '<div class="tx-text">' +
            '<div class="tx-title">' + label + '</div>' +
            '<div class="tx-sub"><span>' + date + '</span> ' + bal + '</div>' +
          '</div>' +
          '<div class="tx-amt ' + cls + '">' + sign + amt + '</div>' +
        '</div>'
      );
    }).join('');
    root.appendChild(wrap);
  }

  const spacer = document.createElement('div');
  spacer.style.height = '32px';
  root.appendChild(spacer);

  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(root);
  if (window.pageStagger) window.pageStagger(content);
}

window.addEventListener('pageshow', loadAll);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') loadAll();
});
</script>
<script src="components/famous.js"></script>
</body>
</html>
